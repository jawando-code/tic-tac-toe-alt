<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x & o</title>
    <link rel="stylesheet" href="/tictactoe.css" />
</head>
<body>
    
<div class="container">
    
    <div class="header">
        <h1>Tic Tac Toe.</h1>    
    </div>
    <div class="image-container">
            <img class="imgs" src="/Images/3884c9d2-2727-4258-9e18-d889986d80f2.webp" alt="japanese art of fantastic demons on paper">
            <img class="imgs" src="/Images/b0ef0b1d-9b85-46cd-a603-30ec7434cc90.webp" alt ="picture of roman columns">
                  <img class="imgs"src="/Images/5e48bc97-8191-4b58-ada0-727c1c41e2c4.webp" alt="statue of bull">
            <img class="imgs" src="/Images/ff11431c-369a-41f5-b7c7-ba34cef91c1c (1).webp" alt="painting of sun in a valley">
             <div id="message"> Player X's turn</div>
        </div>
       

    <div class="main">
       
        <div class="gameboard">
            <div class="field" data-index="0"></div>
            <div class="field" data-index="1"></div>
            <div class="field" data-index="2"></div>
            <div class="field" data-index="3"></div>
            <div class="field" data-index="4"></div>
            <div class="field" data-index="5"></div>
            <div class="field" data-index="6"></div>
            <div class="field" data-index="7"></div>
            <div class="field" data-index="8"></div>    
        </div>
        
    </div>
   
                  <button id="restart"class="restart">Restart</button>
   
   

    <div class="footer" style="text-align: center;">
        <p>Designed by Idowu Jawando. Circa 2026</p>  
    </div>

</div>
    <script src="/script.js"></script>   
</body>
</html>
